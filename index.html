<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rolify has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://rolify.pages.dev/">
  <meta http-equiv="refresh" content="0; url=https://rolify.pages.dev/">
  <script>
    // Runs before the meta refresh and keeps utm_source / utm_campaign, so an
    // ad click that still points here keeps its attribution across the hop.
    location.replace("https://rolify.pages.dev/" + location.search + location.hash);
  </script>
  <style>
    body { background: #121212; color: #b3b3b3; font: 16px/1.6 system-ui, sans-serif;
           display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; }
    a { color: #1db954; }
  </style>
</head>
<body>
  <p>Rolify's page has moved to <a href="https://rolify.pages.dev/">rolify.pages.dev</a>.</p>
</body>
</html>
