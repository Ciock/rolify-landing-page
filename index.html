<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rolify – Sound effects soundboard for D&amp;D and tabletop RPGs</title>
  <meta name="description" content="Bring your D&amp;D sessions to life with sound. Layer ambience, music and effects. Works offline. Free on iOS and Android.">
  <meta name="theme-color" content="#121212">
  <link rel="canonical" href="https://ciock.github.io/rolify-landing-page/">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rolify">
  <meta property="og:title" content="Rolify – Bring your D&amp;D sessions to life with sound">
  <meta property="og:description" content="Layer ambience, music and effects. Works offline. Free on iOS and Android.">
  <meta property="og:url" content="https://ciock.github.io/rolify-landing-page/">
  <meta property="og:image" content="https://ciock.github.io/rolify-landing-page/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="hero">
    <div class="hero__content">
      <div class="brand">
        <img class="brand__icon" src="assets/icon-192.png" alt="" width="56" height="56">
        <span class="brand__name">Rolify</span>
      </div>

      <h1 class="headline">Bring your D&amp;D sessions to life with&nbsp;sound</h1>
      <p class="subheadline">Layer ambience, music &amp; effects. Works offline.</p>

      <div class="stores">
        <a class="store store--ios" data-store="ios"
           href="https://apps.apple.com/app/id1511308478?ct=reddit">
          <img src="assets/app-store-badge.svg" alt="Download on the App Store" width="150" height="50">
        </a>
        <a class="store store--android" data-store="android"
           href="https://play.google.com/store/apps/details?id=com.lucaoropallo.rolify&amp;referrer=utm_source%3Dreddit%26utm_medium%3Dpaid_social">
          <img src="assets/google-play-badge.png" alt="Get it on Google Play" width="168" height="50">
        </a>
      </div>

      <p class="rating"><span class="rating__stars" aria-hidden="true">★★★★★</span> 4.8 on the App Store &amp; Google Play</p>

      <div class="qr">
        <img src="assets/qr.svg" alt="" width="88" height="88">
        <p>Scan to get Rolify<br>on your phone</p>
      </div>
    </div>

    <div class="phone" aria-hidden="true">
      <div class="phone__frame">
        <img class="phone__screen" src="assets/screenshot.jpg" alt="" width="720" height="1565">
      </div>
    </div>

    <footer class="footer">
      <a href="privacy.html">Privacy</a>
    </footer>
  </main>

  <div class="consent" role="dialog" aria-live="polite" aria-label="Cookie consent" hidden>
    <p>We use the Reddit Pixel to measure our ads. <a href="privacy.html">Privacy</a></p>
    <div class="consent__actions">
      <button type="button" data-consent="declined">Decline</button>
      <button type="button" data-consent="accepted">Accept</button>
    </div>
  </div>
</body>
</html>
